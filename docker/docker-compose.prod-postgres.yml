services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: tmt-postgres
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - POSTGRES_DB=tmt
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 미설정}
    command: postgres -c timezone=Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tmt-network

volumes:
  postgres-data:

networks:
  tmt-network:
    name: tmt-network
    driver: bridge
