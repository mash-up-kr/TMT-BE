services:
  postgres:
    image: postgis/postgis:17-3.5
    # postgis 공식 이미지는 arm64 미제공 — Apple Silicon 로컬은 에뮬레이션으로 실행 (운영 EC2는 amd64 네이티브)
    platform: linux/amd64
    container_name: tmt-postgres
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - POSTGRES_DB=tmt
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-12345678}
    command: postgres -c timezone=Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tmt-network

volumes:
  postgres-data:

networks:
  tmt-network:
    name: tmt-network
    driver: bridge
