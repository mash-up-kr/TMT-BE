services:
  mysql:
    image: mysql:8.4
    container_name: tmt-mysql
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - MYSQL_DATABASE=tmt
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-12345678}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      # 로컬에 기존 MySQL(3306)이 있어도 충돌하지 않도록 호스트 포트는 3307 사용
      - "3307:3306"
    networks:
      - tmt-network

volumes:
  mysql-data:

networks:
  tmt-network:
    name: tmt-network
    driver: bridge
