services:
  postgres:
    # 공식 postgis/postgis는 arm64 이미지를 제공하지 않는다.
    # imresamu/postgis는 공식 저장소의 빌드 스크립트로 만든 멀티아키(amd64·arm64) 이미지이며 태그 체계가 동일하다.
    # 태그는 운영(postgis/postgis:16-3.4, infra/terraform/variables.tf)과 같은 메이저로 맞춘다.
    image: imresamu/postgis:16-3.4
    container_name: tmt-postgres-local
    environment:
      - TZ=Asia/Seoul
      - POSTGRES_DB=tmt
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-12345678}
    command: postgres -c timezone=Asia/Seoul
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres-local-data:
