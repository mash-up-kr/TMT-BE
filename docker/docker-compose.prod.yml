services:
  app:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY:-tmt}:latest
    container_name: tmt-app
    restart: unless-stopped
    # 8080 직결은 전환기 동안 유지한다 (TMT-175) — CI 헬스체크와 기존 FE 설정이
    # 아직 이 경로를 쓴다. HTTPS 경로(caddy)로 완전히 넘어가면 닫는다.
    ports:
      - "8080:8080"
    # 물리 메모리보다 작아야 한다 — 크면 도커가 막아주기 전에 호스트가 먼저 마른다.
    # WAS는 t3.micro(916MiB)다. JVM 예산은 Dockerfile의 JAVA_OPTS와 같이 움직인다 (TMT-259)
    mem_limit: 850m
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Seoul
      # DB 접속 정보는 배포 시 SSM 파라미터(/tmt-prod/db/*)에서 .env로 내려온다 (TMT-107).
      # PostgreSQL은 별도 DB 인스턴스에 있다 — 같은 호스트의 도커 네트워크가 아니다.
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # 미디어 버킷·조회 base URL (TMT-201). 정본은 SSM /tmt-prod/media/* — 배포 시 .env로 내려온다.
      # 앱 소비는 TMT-202(사진 업로드 실구현)에서 붙는다.
      - MEDIA_BUCKET=${MEDIA_BUCKET}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL}
      # 리뷰 요약 LLM 키 (TMT-232). 정본은 SSM /tmt-prod/ai/* — 빈 값이면 해당 프로바이더 비활성
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - /etc/localtime:/etc/localtime:ro

  # HTTPS 종단 (TMT-175). 호스트명·근거는 Caddyfile 주석 참고.
  caddy:
    image: caddy:2-alpine
    container_name: tmt-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 인증서 영속화 — 없으면 컨테이너 교체마다 재발급해 Let's Encrypt
      # 레이트리밋(주 50건)을 소모한다
      - caddy_data:/data
      - caddy_config:/config
      - /etc/localtime:/etc/localtime:ro

volumes:
  caddy_data:
  caddy_config:
