services:
  app:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY:-tmt}:latest
    container_name: tmt-app
    restart: unless-stopped
    # nginx 등 리버스 프록시 도입 전까지는 호스트로 직접 노출
    ports:
      - "8080:8080"
    mem_limit: 1280m
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Seoul
      # DB 접속 정보는 배포 시 SSM 파라미터(/tmt-prod/db/*)에서 .env로 내려온다 (TMT-107).
      # PostgreSQL은 별도 DB 인스턴스에 있다 — 같은 호스트의 도커 네트워크가 아니다.
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - /etc/localtime:/etc/localtime:ro
