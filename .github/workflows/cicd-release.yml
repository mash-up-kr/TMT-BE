# 릴리즈 태그(vX.Y.Z) 발행 시 자동 배포 (docs/BRANCHING.md §5)
#
# Oracle Cloud 오사카 WAS로 배포한다 (TMT-445, infra/oracle). 이미지는 OCIR, 서버 접속은 SSH다.
#
# 필요한 Repository secrets:
#   OCIR_USERNAME        : <namespace>/<콘솔 사용자명>
#   OCIR_AUTH_TOKEN      : 그 사용자의 인증 토큰
#   WAS_HOST             : WAS 예약 공인 IP
#   WAS_SSH_KEY          : 배포 전용 SSH 개인 키 (ubuntu 계정)
#   WAS_SSH_KNOWN_HOSTS  : ssh-keyscan으로 받은 WAS 호스트 키 — 중간자 접속을 막는다
#   DISCORD_WEBHOOK_RELEASE_URL : (선택) 배포 알림 웹훅 — 없으면 알림 스킵
#
# 앱 시크릿 정본은 Vault 시크릿 tmt-prod-env다(infra/oracle/vault.tf). WAS가 배포마다 자기 인스턴스
# 권한으로 읽어 .env를 새로 쓴다 — 값을 바꾸려면 콘솔·CLI로 새 버전을 만들고 재배포한다.
# PostgreSQL은 DB 인스턴스 소관이라 여기서 건드리지 않는다.
name: CI/CD

on:
  release:
    types:
      - published

env:
  OCIR_REGISTRY: kix.ocir.io
  APP_IMAGE_REPO: kix.ocir.io/axrpyc6zylkj/tmt
  # terraform output app_env_secret_id — 식별자일 뿐 값이 아니다
  APP_ENV_SECRET_ID: ocid1.vaultsecret.oc1.ap-osaka-1.amaaaaaaaj6wb6aahoqigq22wvb3yjsrgfsmvifpf53wfll2guxushpao5yq

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # 릴리즈가 연달아 발행되면 같은 WAS를 동시에 재기동하지 않도록 큐에 세운다 —
    # 배포 도중 취소되면 컨테이너가 어중간한 상태로 남으므로 끊지 않는다.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Repository 접근
        uses: actions/checkout@v4

      - name: JDK 21 셋팅
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 의존성 캐싱
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: JAR 빌드
        run: ./gradlew :tmt-bootstrap:bootJar

      - name: OCIR 로그인
        env:
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
          OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
        run: echo "$OCIR_AUTH_TOKEN" | docker login "$OCIR_REGISTRY" -u "$OCIR_USERNAME" --password-stdin

      # WAS가 E2.1.Micro(x86)라 러너(amd64)에서 그대로 빌드한다
      - name: Docker 이미지 빌드 및 푸시
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          docker build -t "${APP_IMAGE_REPO}:${TAG}" -t "${APP_IMAGE_REPO}:latest" .
          docker push "${APP_IMAGE_REPO}:${TAG}"
          docker push "${APP_IMAGE_REPO}:latest"

      - name: SSH 준비
        env:
          WAS_SSH_KEY: ${{ secrets.WAS_SSH_KEY }}
          WAS_SSH_KNOWN_HOSTS: ${{ secrets.WAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$WAS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$WAS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 배포 (SSH)
        env:
          WAS_HOST: ${{ secrets.WAS_HOST }}
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
          OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          # Sentry 이벤트의 릴리즈 — 어느 커밋에서 난 에러인지 이 값으로 갈린다 (TMT-325)
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes ubuntu@${WAS_HOST}"
          $SSH 'sudo tee /opt/tmt/docker-compose.prod.yml >/dev/null' < docker/docker-compose.prod.yml
          $SSH 'sudo tee /opt/tmt/Caddyfile >/dev/null' < docker/Caddyfile
          $SSH 'sudo tee /opt/tmt/remote-deploy.sh >/dev/null' < scripts/deploy/remote-deploy.sh
          echo "$OCIR_AUTH_TOKEN" | $SSH "sudo docker login ${OCIR_REGISTRY} -u '${OCIR_USERNAME}' --password-stdin"
          $SSH "sudo bash /opt/tmt/remote-deploy.sh '${APP_IMAGE_REPO}:${TAG}' '${SENTRY_RELEASE}' '${APP_ENV_SECRET_ID}'"

      - name: 헬스체크
        env:
          WAS_HOST: ${{ secrets.WAS_HOST }}
          # 실도메인 전환(TMT-446) 뒤 api.ttomatto.kr로 바꾼다
          API_HOST: 129-225-153-130.sslip.io
        run: |
          # 1) 앱 자체 — 서버 안에서 8080으로 본다. E2.1.Micro는 기동에 90초 안팎이 걸린다
          SSH="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes ubuntu@${WAS_HOST}"
          for _ in $(seq 1 60); do
            if $SSH 'curl -sf localhost:8080/api/health/db >/dev/null'; then
              echo ">>> 앱 헬스체크 통과"
              break
            fi
            sleep 5
          done
          $SSH 'curl -sf localhost:8080/api/health/db >/dev/null' || {
            echo "::error::5분 내에 /api/health/db가 응답하지 않았습니다 — docker logs tmt-app을 보세요"
            exit 1
          }

          # 2) HTTPS 경로 (caddy → app). 첫 배포는 인증서 발급 시간이 포함된다 (TMT-175)
          for _ in $(seq 1 36); do
            if curl -sf "https://${API_HOST}/api/health/db" >/dev/null; then
              echo ">>> HTTPS 헬스체크 통과"
              exit 0
            fi
            sleep 5
          done
          echo "::error::3분 내에 https://${API_HOST}/api/health/db가 응답하지 않았습니다 — FE가 쓰는 경로다"
          exit 1

      - name: 디스코드 배포 알림
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_RELEASE_URL }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_RELEASE_URL 미설정 → 알림 스킵"
            exit 0
          fi
          payload=$(jq -n \
            --arg content "@everyone\n🚀 또맛또(TMT) 백엔드 배포 완료" \
            --arg tag "$RELEASE_TAG" \
            --arg name "$RELEASE_NAME" \
            --arg body "$RELEASE_BODY" \
            '{
              content: $content,
              allowed_mentions: { parse: ["everyone"] },
              embeds: [
                {
                  title: ($name + " (" + $tag + ")"),
                  description: $body,
                  color: 5814783
                }
              ]
            }')
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
