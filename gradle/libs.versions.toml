[versions]
awsSdk = "2.31.9"
springBoot = "4.1.0"
springDependencyManagement = "1.1.7"
kotlinPlugin = "2.3.21"
querydsl = "5.1.0"
testcontainers = "1.21.3"
ktLintPlugin = "14.2.0"
javaVersion = "21"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinPlugin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlinPlugin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlinPlugin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlinPlugin" }
kotlin-lint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktLintPlugin" }

[libraries]
# Kotlin
kotlin-jackson = { group = "tools.jackson.module", name = "jackson-module-kotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect" }
kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging-jvm", version = "8.0.4" }

# Spring
spring-transaction = { group = "org.springframework", name = "spring-tx" }

spring-boot-starter-autoconfigure = { group = "org.springframework.boot", name = "spring-boot-autoconfigure" }
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc" }
spring-boot-starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }
spring-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation" }
spring-boot-starter-jpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa" }
spring-boot-docs = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-ui", version = "3.0.3" }

# QueryDSL
querydsl-jpa = { group = "com.querydsl", name = "querydsl-jpa", version.ref = "querydsl" }
querydsl-apt = { group = "com.querydsl", name = "querydsl-apt", version.ref = "querydsl" }

# PostgreSQL
postgresql = { group = "org.postgresql", name = "postgresql" }

# Flyway (버전은 Spring Boot BOM이 관리)
# Boot 4에서 FlywayAutoConfiguration이 별도 모듈로 빠져, flyway-core만 넣으면 자동설정이 붙지 않는다.
spring-boot-starter-flyway = { group = "org.springframework.boot", name = "spring-boot-starter-flyway" }
aws-s3 = { group = "software.amazon.awssdk", name = "s3", version.ref = "awsSdk" }
spring-web = { group = "org.springframework", name = "spring-web" }
flyway-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql" }

# Sentry
sentry-logback = { group = "io.sentry", name = "sentry-logback", version = "8.16.0" }

# Test
spring-boot-annotation-processor = { group = "org.springframework.boot", name = "spring-boot-configuration-processor" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
kotlin-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5" }
junit = { group = "org.junit.platform", name = "junit-platform-launcher" }
mockk = { group = "io.mockk", name = "mockk", version = "1.14.11" }
# Testcontainers (TMT-295) — persistence 통합 테스트에서 실 PostGIS를 띄운다
testcontainers-postgresql = { group = "org.testcontainers", name = "postgresql", version.ref = "testcontainers" }
testcontainers-junit = { group = "org.testcontainers", name = "junit-jupiter", version.ref = "testcontainers" }
# Boot 4는 test 자동설정을 모듈별로 쪼갰다 — @DataJpaTest·@AutoConfigureTestDatabase가 여기 있다
spring-boot-starter-data-jpa-test = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa-test" }

[bundles]
# 공통 (convention에서 사용)
spring-common = ["spring-boot-starter-autoconfigure"]
kotlin-spring = ["kotlin-reflect", "kotlin-jackson", "kotlin-logging"]
test-implementation = ["spring-boot-starter-test", "kotlin-junit5", "mockk"]
test-runtime = ["junit"]
# persistence 모듈에서만 쓴다 — 공통 test 번들에 넣으면 전 모듈이 컨테이너 의존성을 끌어온다
test-containers = ["testcontainers-postgresql", "testcontainers-junit", "spring-boot-starter-data-jpa-test"]

# 모듈별
bootstrap = ["spring-boot-starter-web", "spring-boot-starter-actuator"]
domain-application = ["spring-transaction"]
adaptor-input-http = ["spring-boot-starter-web", "spring-boot-docs", "spring-boot-starter-validation"]
adaptor-persistence-postgres = ["spring-boot-starter-jpa", "postgresql", "spring-boot-starter-flyway", "flyway-postgresql"]
