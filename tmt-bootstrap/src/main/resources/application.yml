spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - classpath:application-actuator.yml
      - classpath:application-http.yml

  flyway:
    # history 테이블 없이 public에 객체가 있으면 기동이 막히는 것을 막는다.
    # baseline-version이 기본값 1이면 V1이 적용된 것으로 기록돼 건너뛰므로 0으로 둔다.
    baseline-on-migrate: true
    baseline-version: "0"

  jpa:
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

tmt:
  ai-summary:
    # 리뷰 요약 LLM (TMT-232). 키는 SSM /tmt-prod/ai/* -> 배포 .env. 키가 없으면 해당 프로바이더는 건너뛴다
    groq:
      api-key: ${GROQ_API_KEY:}
      model: llama-3.3-70b-versatile
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.5-flash
    batch-size: 100
    backfill-cron: "0 */10 * * * *"
  media:
    # TMT-201 버킷. 정본은 SSM /tmt-prod/media/* — 배포 시 .env로 내려온다 (로컬은 빈 값이면 발급 시점에 실패)
    bucket: ${MEDIA_BUCKET:}
    base-url: ${MEDIA_BASE_URL:}
    region: ap-northeast-2
    upload-url-ttl: PT15M
    # 작성 중 이탈로 남은 STAGED 사진의 수명 (M4). 넘기면 S3 객체와 행을 함께 걷어낸다
    staged-ttl: P1D
    purge-cron: "0 40 4 * * *"
  mock:
    # UT2 한정 (TMT-250). 근처 탐색·가게 상세를 mock으로 되돌린다 — 매장은 DB(141k 적재),
    # 리뷰·저장은 mock 인메모리라 placeId가 서로 다른 매장을 가리켜 화면이 어긋난다.
    # 저장·리뷰 실구현(TMT-224·225)이 들어오면 false로 내리고 이 키를 지운다.
    place-explore: true
  idempotency:
    # 이 기간이 지난 재시도는 멱등 기록이 없어 비즈니스 로직을 다시 탄다.
    ttl: P1D
    purge-cron: "0 20 4 * * *"

server:
  port: 8080
  shutdown: graceful
