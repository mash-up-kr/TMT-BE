spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - classpath:application-actuator.yml
      - classpath:application-http.yml

  flyway:
    # history 테이블 없이 public에 객체가 있으면 기동이 막히는 것을 막는다.
    # baseline-version이 기본값 1이면 V1이 적용된 것으로 기록돼 건너뛰므로 0으로 둔다.
    baseline-on-migrate: true
    baseline-version: "0"

  jpa:
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

tmt:
  ai-summary:
    # 리뷰 요약 LLM (TMT-232). 키는 SSM /tmt-prod/ai/* -> 배포 .env. 키가 없으면 해당 프로바이더는 건너뛴다
    groq:
      api-key: ${GROQ_API_KEY:}
      model: llama-3.3-70b-versatile
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.5-flash
    batch-size: 100
    backfill-cron: "0 */10 * * * *"
  idempotency:
    # 이 기간이 지난 재시도는 멱등 기록이 없어 비즈니스 로직을 다시 탄다.
    ttl: P1D
    purge-cron: "0 20 4 * * *"

server:
  port: 8080
  shutdown: graceful
