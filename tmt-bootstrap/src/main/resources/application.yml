spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - classpath:application-actuator.yml
      - classpath:application-http.yml

  flyway:
    # history 테이블 없이 public에 객체가 있으면 기동이 막히는 것을 막는다.
    # baseline-version이 기본값 1이면 V1이 적용된 것으로 기록돼 건너뛰므로 0으로 둔다.
    baseline-on-migrate: true
    baseline-version: "0"

  jpa:
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

tmt:
  ai-summary:
    # 리뷰 요약 LLM (TMT-232). 키는 SSM /tmt-prod/ai/* -> 배포 .env. 키가 없으면 해당 프로바이더는 건너뛴다
    groq:
      api-key: ${GROQ_API_KEY:}
      # llama-3.3-70b는 Groq에서 내려갔다(model_not_found). 실호출로 후보를 비교해 고른 값 —
      # gpt-oss-120b는 한국어 띄어쓰기가 깨지고 토큰을 5배 썼다 (TMT-232)
      # 모델이 또 소멸하면 코드 배포 없이 SSM /tmt-prod/ai/groq-model 값으로 바꾼다 (TMT-297)
      model: ${GROQ_MODEL:qwen/qwen3.8-27b}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.5-flash
    batch-size: 100
    backfill-cron: "0 */10 * * * *"
  address:
    # 주소 검색 (TMT-187). 페이지 상한 — 외부 호출이 페이지당 1회라 무한 순회를 막는다.
    # 상한에 닿으면 hasNext=false · truncated=true (F §2-2)
    max-page: 5
    juso:
      # 행안부 도로명주소 승인키. **검색용과 좌표용이 다른 키다** (F §8 juso 1번).
      # 정본은 SSM /tmt-prod/address/* -> 배포 .env. 키가 없으면 ADDRESS_PROVIDER_UNAVAILABLE로 끊는다
      search-key: ${JUSO_SEARCH_KEY:}
      coord-key: ${JUSO_COORD_KEY:}
      circuit:
        # 재시도 대신 차단기 — 차단 상태에서 계속 때리면 나빠지기만 한다 (F §2-3)
        failure-threshold: 5
        open-seconds: 60
    token:
      # addressId 서명 키(HMAC-SHA256). 시크릿이라 커밋하지 않는다 (TMT-191)
      secret: ${ADDRESS_TOKEN_SECRET:}  # local은 application-local.yml, prod는 필수 (application-prod.yml)
  media:
    # TMT-201 버킷. 정본은 SSM /tmt-prod/media/* — 배포 시 .env로 내려온다 (로컬은 빈 값이면 발급 시점에 실패)
    bucket: ${MEDIA_BUCKET:}
    base-url: ${MEDIA_BASE_URL:}
    region: ap-northeast-2
    upload-url-ttl: PT15M
    # 작성 중 이탈로 남은 STAGED 사진의 수명 (M4). 넘기면 S3 객체와 행을 함께 걷어낸다
    staged-ttl: P1D
    purge-cron: "0 40 4 * * *"
  idempotency:
    # 이 기간이 지난 재시도는 멱등 기록이 없어 비즈니스 로직을 다시 탄다.
    ttl: P1D
    purge-cron: "0 20 4 * * *"

server:
  port: 8080
  shutdown: graceful
