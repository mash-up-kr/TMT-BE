spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - classpath:application-actuator.yml
      - classpath:application-http.yml

  flyway:
    # history 테이블 없이 public에 객체가 있으면 기동이 막히는 것을 막는다.
    # baseline-version이 기본값 1이면 V1이 적용된 것으로 기록돼 건너뛰므로 0으로 둔다.
    baseline-on-migrate: true
    baseline-version: "0"

  jpa:
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

server:
  port: 8080
  shutdown: graceful
