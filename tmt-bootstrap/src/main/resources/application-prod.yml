spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    # 호스트를 하드코딩하면 인프라가 바뀔 때마다 코드를 고쳐야 한다. 값은 배포 시
    # SSM 파라미터(/tmt-prod/db/*)에서 주입된다 (TMT-107). 기본값을 두지 않아
    # 누락 시 기동 단계에서 바로 실패한다.
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?reWriteBatchedInserts=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

tmt:
  address:
    token:
      # 기본값을 두지 않아 누락 시 기동 단계에서 바로 실패한다 — 코드에 박힌 키로
      # 서명하면 클라이언트가 임의 좌표로 매장을 만들 수 있다 (TMT-191)
      secret: ${ADDRESS_TOKEN_SECRET}

# 에러 수집 (TMT-325). DSN이 비면 SDK가 no-op이다.
# release는 배포 커밋 SHA — CI가 .env로 내려준다
sentry:
  dsn: ${SENTRY_DSN:}
  release: ${SENTRY_RELEASE:}
